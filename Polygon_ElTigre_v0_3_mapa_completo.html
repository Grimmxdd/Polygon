.banner{margin:0 16px 6px;padding:11px 14px;border:1px solid #553f83;background:#0b0b17dd;border-radius:15px;display:flex;align-items:center;justify-content:space-between;z-index:4}

.road{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.road-motorway{stroke:#d5c6ff;stroke-width:5}.road-trunk{stroke:#bca7ff;stroke-width:4}.road-primary{stroke:#9f8cff;stroke-width:3.5}.road-secondary{stroke:#786f9c;stroke-width:2.7}.road-tertiary{stroke:#59566f;stroke-width:2}.road-unclassified{stroke:#414052;stroke-width:1.5}.road-residential{stroke:#343444;stroke-width:1.25}.road-living_street{stroke:#30303e;stroke-width:1.1}.road-service{stroke:#292936;stroke-width:.9}
.road-motorway_link{stroke:#b9aaff;stroke-width:3}.road-trunk_link{stroke:#9b8cff;stroke-width:2.8}.road-primary_link{stroke:#8173c9;stroke-width:2.5}.road-secondary_link{stroke:#66607f;stroke-width:2.1}.road-tertiary_link{stroke:#4d4a60;stroke-width:1.7}

.controls{position:absolute;right:13px;top:40%;display:flex;flex-direction:column;gap:8px}.ctrl{width:44px;height:44px;border:1px solid #392b60;background:#0a0a16dd;color:#cbb8ff;border-radius:13px;font-size:22px}
.bottom{background:linear-gradient(180deg,#0d0b19f4,#080812);border:1px solid #4b3375;border-radius:24px 24px 0 0;padding:12px 14px calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -10px 35px #0008}
.handle{width:46px;height:5px;border-radius:9px;background:#8661c7;margin:0 auto 12px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px}.card small{color:#968cae;display:block;font-size:11px}.card strong{font-size:20px}.state{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{height:58px;border-radius:15px;border:1px solid;font-weight:800;color:white;font-size:15px}.no{background:#6d142044;border-color:#ff3e52}.yes{background:#146d3c33;border-color:#36e27a}

<script>
let currentHex=document.querySelector('.hex.outage')||document.querySelector('.hex');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1800)}
function report(status){if(!currentHex)return;currentHex.classList.remove('stable','unstable','outage');currentHex.classList.add(status);currentHex.dataset.status=status;const st=document.getElementById('state');st.textContent=status==='stable'?'TENGO LUZ':'SIN LUZ';st.style.color=status==='stable'?'#36e27a':'#ff3e52';document.getElementById('reports').textContent=Number(document.getElementById('reports').textContent)+1;document.getElementById('source').textContent='Reporte registrado localmente';document.getElementById('updated').textContent='Actualizado ahora · cola local';toast(status==='stable'?'🟢 Reporte guardado':'🔴 Reporte guardado')}
document.querySelectorAll('.hex').forEach(h=>h.addEventListener('click',()=>{currentHex=h;const s=h.dataset.status;const st=document.getElementById('state');st.textContent=s==='stable'?'TENGO LUZ':s==='unstable'?'INESTABLE':'SIN LUZ';st.style.color=s==='stable'?'#36e27a':s==='unstable'?'#ffc52e':'#ff3e52';document.getElementById('sector').textContent=h.id;toast('Sector '+h.id+' seleccionado')}));
function locate(){if(!navigator.geolocation){toast('GPS no disponible');return}navigator.geolocation.getCurrentPosition(()=>toast('📍 Ubicación recibida'),()=>toast('Permiso de ubicación no concedido'))}
